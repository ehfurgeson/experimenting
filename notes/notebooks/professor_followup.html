      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

", "name": "_"}, {"code": "", "code_hash": "bcd323b543ff92b893b1cebe890d4a1c", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": false}, "id": "ecfG", "name": "_"}, {"code": "", "code_hash": "dbacf9d7b8c234acfb2ab0a70d7f3623", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": false}, "id": "Pvdt", "name": "_"}, {"code": "", "code_hash": "13e2728706a106a15fe3467371b8261c", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": false}, "id": "ZBYS", "name": "_"}, {"code": "", "code_hash": "cf864671143ad14eef34aa43828c17ee", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": false}, "id": "aLJB", "name": "_"}, {"code": "", "code_hash": "7efb700c859eb10ecc783759940ef2f6", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": false}, "id": "nHfw", "name": "_"}, {"code": "", "code_hash": "68d901557fa8dcb49f291515c8bd421f", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": false}, "id": "xXTn", "name": "_"}], "metadata": {"marimo_version": "0.25.2"}, "version": "1"},
            "session": {"cells": [{"code_hash": "8f35857d6b0e516d345df971064b540b", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "6e56e457b6a12e7629a93a39fdd12126", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Chr /\u003E\n\u003Ch1 id=\"research-findings-in-response-to-the-professors-requests\"\u003EResearch findings in response to the professor's requests\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EPresentation overview \u00b7 5 November 2026\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EResearch question:\u003C/strong\u003E Can molecular formulas and chemical fingerprints help\ndistinguish herbicides, allelopathic compounds and benign comparison compounds?\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ECurrent finding:\u003C/strong\u003E Formula and fingerprint models distinguish the selected\nherbicide and natural-product groups well. Prediction of actual plant activity\nor toxicity, and the proposed three-group ordering, remain unvalidated.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "8104bf0ca1d21ae9c18d18c6b6ac0b26", "console": [], "id": "vblA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"1-which-features-explain-the-strong-formula-result\"\u003E1. Which features explain the strong formula result?\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe original result was reproduced on \u003Cstrong\u003E171 compounds: 55 selected herbicides\nand 116 selected natural products\u003C/strong\u003E. All compared models used the same five\ntest folds, keeping compounds with the same core structure (scaffold) together.\nBalanced accuracy uses a 0.5 classification cutoff; AUROC measures ranking across cutoffs.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EHalogens contribute substantial signal:\u003C/strong\u003E F/Cl/Br/I occur in \u003Cstrong\u003E37/55\u003C/strong\u003E selected\nherbicides and \u003Cstrong\u003E1/116\u003C/strong\u003E natural products. Recalculating formula features without\nthese elements reduced AUROC from \u003Cstrong\u003E0.9516 to 0.9130\u003C/strong\u003E\nand balanced accuracy from \u003Cstrong\u003E91.91% to 82.15%\u003C/strong\u003E.\nThe remaining separation shows that halogens are not the only useful information.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe formula model uses 27 composition features. PCA compresses correlated\nvariables before fitting. A separate logistic model without that compression\nhad nearly the same AUROC. Its strongest standardized coefficients involved\n\u003Cstrong\u003Enitrogen count, chlorine count, number of distinct elements, carbon count\nand oxygen count\u003C/strong\u003E. Nitrogen/chlorine counts were associated with selected\nherbicides; oxygen count was associated with natural products. These are\nstatistical associations in this collection, not demonstrated causes of activity.\u003C/span\u003E\n\u003Ch2 id=\"2-chemical-fingerprints-and-logisticrandom-forest-classifiers\"\u003E2. Chemical fingerprints and logistic/random forest classifiers\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003ERDKit generated \u003Cstrong\u003E2048-bit Morgan fingerprints\u003C/strong\u003E from usable SMILES, encoding\nlocal atom neighborhoods. Fingerprints exist for \u003Cstrong\u003E174/176 original compounds\u003C/strong\u003E\n(two multicomponent entries were excluded), all \u003Cstrong\u003E154 assay candidates\u003C/strong\u003E and all\n\u003Cstrong\u003E40 dietary candidates\u003C/strong\u003E. The model comparison below uses the same \u003Cstrong\u003E171\nformula-eligible compounds\u003C/strong\u003E for fairness; three additional charged structures\nhave fingerprints but unsupported formula features.\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EModel on the matched source-selection cohort\u003C/th\u003E\n\u003Cth style=\"text-align: right;\"\u003EAUROC\u003C/th\u003E\n\u003Cth style=\"text-align: right;\"\u003EBalanced accuracy\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EFormula logistic regression, original PCA pipeline\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E0.9516\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E91.91%\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EMorgan fingerprint logistic regression\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E0.9467\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E88.66%\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EMorgan fingerprint random forest\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E0.9487\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E88.66%\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EThe fingerprint models performed well but did not improve balanced accuracy\nover the formula baseline under these fixed settings. \u003Cstrong\u003EThey separate selected\nherbicides from selected natural products; they have not yet been tested as\nherbicide-versus-verified-benign classifiers.\u003C/strong\u003E The first recommended paper\nproposes MAP4, a different fingerprint that has not been benchmarked here.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c97d35b74292958c16fd9eed7785889a", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"3-benign-comparison-candidates-and-manual-review\"\u003E3. Benign comparison candidates and manual review\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EA \u003Cstrong\u003E40-compound pilot\u003C/strong\u003E was prepared, rather than a 200-compound verified list.\nThe requested four-column TSV contains names, PubChem IDs, SMILES and InChIKeys.\nAll 40 structures passed PubChem/RDKit identity consistency checks. That checks\nthe structure records, not their biological safety.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EPreliminary review used \u003Cstrong\u003E95 saved source requests\u003C/strong\u003E, food-use evidence,\nchemical-hazard records and selected toxicity/interaction passages. It yielded\n\u003Cstrong\u003E12 provisional dietary candidates,\n26 priority-review cases and\n2 exclusions from a presumed plant-inactive group\u003C/strong\u003E.\nThese are review priorities: \u003Cstrong\u003Enone has an accepted high-dose-safety or\nplant-inactivity label\u003C/strong\u003E. Exact occurrence, exposure, population and source\nrestrictions still require human verification.\u003C/span\u003E\n\u003Ch2 id=\"4-evidence-for-actual-plant-activity-and-the-three-group-comparison\"\u003E4. Evidence for actual plant activity and the three-group comparison\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe deeper source review covers \u003Cstrong\u003E154 compounds, 157 observations and 14\npublications\u003C/strong\u003E. The earlier package proposed 47 active and\n31 low-response cases across three separate assay policies.\n\u003Cstrong\u003EThe new 5 November release flags a structure conflict for Li compound 7b\n(CHEMBL2253255): the reported source allyl group differs from the frozen\ncyclopropyl group.\u003C/strong\u003E Its activity must be held until the original drawing/SI\nand mapping are checked. Current scenarios therefore contain \u003Cstrong\u003E46\nconditional active, 31 low response, 8 gray,\n68 unassessed and 1 identity hold\u003C/strong\u003E;\nnone is approved for training.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EWhat the new release adds:\u003C/strong\u003E independent retrieval reproduced \u003Cstrong\u003E15 full\ndatabase identity matches\u003C/strong\u003E (four fungal ophiobolins, 11 pesticide records)\nand one connectivity-only comparison with unresolved geometry. Of 24 Li\ncompounds, 21 have reported substituent consistency, one has the 7b conflict,\n7w remains unresolved and the comparator needs a geometry check. All 24\nreported response bands agree with the old records; that does not prove the\nresponse belongs to the frozen structure. No original Li figures/SI were\nindependently visually verified in this audit.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe 11 additional natural-product names yielded \u003Cstrong\u003Efive PubChem identity\ncandidates with new fingerprints and six unresolved name searches\u003C/strong\u003E. Source\ndrawing matches and activity/occurrence labels remain unverified. The accessible\n2021 leaf study adds bounded weak/no-lesion leads, with punctured/intact leaves\nand dose recorded separately; these are not general plant-inactivity labels.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ENo new activity model was fitted.\u003C/strong\u003E Accepted labels remain zero. Even after\nexcluding the identity hold, the proposed Li negatives span only two scaffolds\nand fail the current three-/five-fold checks. Existing selection-model results\nare unchanged: the held compound was not in that model cohort.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EThe herbicide\u2013allelopath\u2013benign comparison has not yet been completed.\u003C/strong\u003E\nNatural occurrence, allelopathic effects, dietary tolerance and plant inhibition\nare different attributes and can overlap. There is no evidence yet that the\nallelopaths occupy a numerical middle position. The four ophiobolin occurrence\nleads are useful candidates for a natural-active review, not established benign\ncontrols or a verified ecological allelopathy group.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "162cbc95b75f9fd9708d9fc15336c372", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"5-work-still-required\"\u003E5. Work still required\u003C/h2\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003EDefine the study claims and groups.\u003C/strong\u003E Agree what counts as plant activity,\n   low response, allelopathy and a benign dietary comparison, including the\n   relevant species, dose, duration and endpoint. General toxicity needs its\n   own measured endpoint and labels.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EVerify the evidence and accept labels.\u003C/strong\u003E Resolve Li 7b first, then 7w and\n   the comparator geometry; visually validate the other 21 Li assignments.\n   Match each plant result to its exact source structure and table cell. Check the dietary candidates against\n   exact occurrence and exposure evidence. Keep unresolved cases unknown.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EBroaden independent chemistry.\u003C/strong\u003E Li 2006's proposed low-response cases\n   span only two scaffolds; He's known subset spans two scaffolds altogether.\n   Both fail the present three-/five-fold scaffold checks, even if the proposed\n   labels are eventually verified. More independent negative-bearing families\n   and publications are needed.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EEvaluate the requested biological comparison.\u003C/strong\u003E Once labels and study\n   roles are accepted, compare formula and fingerprint logistic/forest models\n   on matched holdouts. Reserve independent compounds/publications, assess\n   calibration and chemical-domain limits, and test the allelopath ordering\n   without building that order into the labels.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EMethods reading:\u003C/strong\u003E \u003Ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC7291580/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EMAP4 paper\u003C/a\u003E,\n\u003Ca href=\"https://www.sciencedirect.com/science/article/pii/S135964462200349X\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Efingerprint review\u003C/a\u003E,\n\u003Ca href=\"https://greglandrum.github.io/rdkit-blog/posts/2023-01-18-fingerprint-generator-tutorial.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003ERDKit fingerprint tutorial\u003C/a\u003E.\u003C/span\u003E\n\u003Chr /\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "4e631d1c8650d80858b9e7d1aa98e254", "console": [], "id": "PKri", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"verification-exact-next-actions\"\u003EVerification: exact next actions\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EWorking instructions, separate from the presentation findings above.\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAn editable pack is ready at\n\u003Ccode\u003Eanalysis/outputs/manual-verification-2026-11-05/\u003C/code\u003E.\nThe full instructions are in \u003Ccode\u003Eanalysis/docs/verification-checklist.md\u003C/code\u003E.\nOriginal source files remain unchanged; no human decisions have been filled in.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ENew priority:\u003C/strong\u003E resolve Li \u003Cstrong\u003E7b / CHEMBL2253255\u003C/strong\u003E first. The latest release\nreports an allyl-versus-cyclopropyl discrepancy; keep activity unknown until\noriginal PDF/SI and chemistry review resolve it. Then check 7w and KIH-6127\ngeometry. See \u003Ccode\u003Eanalysis/docs/verification-release.md\u003C/code\u003E and the section 6c tables.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EFor the Li/He plant-assay compounds:\u003C/strong\u003E\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EStart with \u003Ccode\u003Eassays/li2006_source_mapping.csv\u003C/code\u003E (24 rows), then review\n   \u003Ccode\u003Ehe2011_source_mapping.csv\u003C/code\u003E (58 rows) separately. Obtain each original PDF/SI.\u003C/li\u003E\n\u003Cli\u003ECompare the paper's structure with the matching computed SVG sheet in\n   \u003Ccode\u003Eassays/structure_drawings/\u003C/code\u003E. Record the paper compound number, structure\n   page and exact match/unresolved/conflict decision. Get chemistry help if unsure.\u003C/li\u003E\n\u003Cli\u003EFind that compound's exact result row and species/dose/application column.\n   Save a cited excerpt and transcribe the original symbol, grade or inequality.\u003C/li\u003E\n\u003Cli\u003ERecord species/stage, rate and units, application mode, duration, controls\n   and replication from the methods. Record missing details and conflicts explicitly.\u003C/li\u003E\n\u003Cli\u003EAgree a source-specific decision rule with the research lead. Record human\n   reviewer/date, the accepted policy and approval reference. Unresolved evidence\n   remains unknown; a low response applies only to the declared assay conditions.\u003C/li\u003E\n\u003Cli\u003ETransfer only accepted decisions into separately versioned seven-column\n   label files, one policy per file. Run \u003Ccode\u003Eanalysis/validate_activity_proposal.py\u003C/code\u003E\n   with the frozen latest audit (exact command in the release assessment).\n   It checks the new hold as well as schema; passing does not verify scientific\n   approval. Broaden scaffold support before activity modeling.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EFor the 40 dietary candidates:\u003C/strong\u003E\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EUse \u003Ccode\u003Edietary/triage_reference.csv\u003C/code\u003E to prioritize review; start with the 12\n   provisional cases. Edit \u003Ccode\u003Edietary/review.csv\u003C/code\u003E, not the frozen original.\u003C/li\u003E\n\u003Cli\u003EDefine a specific population, oral amount/units, duration and endpoint.\n   Match the exact compound/form and document occurrence in the claimed organism.\u003C/li\u003E\n\u003Cli\u003ERead the primary exposure evidence and each flag in context. Record the\n   dose, route/time, restrictions, citation, reviewer and bounded decision.\n   Food use and absence of warnings alone do not establish high-dose safety.\u003C/li\u003E\n\u003Cli\u003EObtain separate suitable plant-assay evidence before calling any dietary\n   candidate plant-inactive. The four natural-active occurrence leads likewise\n   require their own identity, activity and ecological-role checks.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Chr /\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "fcb6846eff4b80febf58dcac23b557a7", "console": [], "id": "Xref", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "bcf80c7c9be392cf4a343a848495dac0", "console": [], "id": "SFPL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"supporting-analysis-and-source-evidence\"\u003ESupporting analysis and source evidence\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EThe sections below document the methods, model comparisons, errors, dietary\ntriage and deeper assay-review audit behind the presentation findings.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EFrozen model products passed their saved SHA-256 checks. All eight held-out\nAUROC/balanced-accuracy pairs were recomputed, shared compound/fold assignments\nchecked and scaffold leakage rejected. The triage and deeper-review sections\nverify their own saved audit products. This notebook reads evidence; it does\nnot retrieve compounds, fit models, assign labels or edit the working copies.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b392b7660f6db62561be8bc307411a34", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"1-define-exactly-what-the-existing-result-measures\"\u003E1. Define exactly what the existing result measures\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe evaluation cohort is \u003Cstrong\u003E55 selected herbicides and 116 selected natural\nproducts\u003C/strong\u003E, after the established identity/formula eligibility and deduplication\npolicy. The prepared selection was larger (176); this diagnostic uses the same\ncomplete 171-compound cohort as the older ablations. Source membership=1 means\nselected herbicide; source membership=0 means selected natural product.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EFive fixed \u003Cstrong\u003Escaffold-held-out\u003C/strong\u003E folds keep compounds with the same RDKit\nscaffold together. The same compounds/folds are used for every profile.\nTraining-only preprocessing avoids exposing the held-out compounds to fitting.\nNo seed/threshold/hyperparameter search was performed; the cutoff remains 0.5.\nAll acyclic chemistry shares the ACYCLIC group under the existing policy.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAUROC measures ranking; balanced accuracy averages sensitivity and specificity\nat the chosen cutoff. They answer different questions. High selection accuracy\ncan reflect how the lists were assembled, rather than herbicidal efficacy.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "dcdcc946c7dcfb156c21f8f3066caa42", "console": [], "id": "RGSE", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"2-test-the-halogen-hypothesis\"\u003E2. Test the halogen hypothesis\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E37/55 selected herbicides have halogens, versus 1/116 natural products.\u003C/strong\u003E\nPresence alone reaches 83.21% balanced accuracy, so it is a strong clue.\nIt does not recover all the original performance.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETwo ablations distinguish direct columns from indirect composition clues:\n(a) drop F/Cl/Br/I counts and fractions;\n(b) additionally recalculate element count, atom count and all remaining\nfractions without halogens. The stricter ablation still reaches\n\u003Cstrong\u003E0.9130 AUROC / 82.15% balanced accuracy\u003C/strong\u003E. This supports additional signal.\nIt does not establish causal elemental effects, or chemically simulate\nreplacing halogens in real molecules.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='RGSE-0' random-id='c5e23ea9-587d-4b87-2f16-ef4711f32b36'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;label\u0026#92;\u0026quot;:0,\u0026#92;\u0026quot;halogen_present\u0026#92;\u0026quot;:0,\u0026#92;\u0026quot;len\u0026#92;\u0026quot;:115},{\u0026#92;\u0026quot;label\u0026#92;\u0026quot;:0,\u0026#92;\u0026quot;halogen_present\u0026#92;\u0026quot;:1,\u0026#92;\u0026quot;len\u0026#92;\u0026quot;:1},{\u0026#92;\u0026quot;label\u0026#92;\u0026quot;:1,\u0026#92;\u0026quot;halogen_present\u0026#92;\u0026quot;:0,\u0026#92;\u0026quot;len\u0026#92;\u0026quot;:18},{\u0026#92;\u0026quot;label\u0026#92;\u0026quot;:1,\u0026#92;\u0026quot;halogen_present\u0026#92;\u0026quot;:1,\u0026#92;\u0026quot;len\u0026#92;\u0026quot;:37}]\u0026quot;' data-total-rows='4' data-total-columns='3' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='10' data-field-types='[[\u0026quot;label\u0026quot;,[\u0026quot;integer\u0026quot;,\u0026quot;i64\u0026quot;]],[\u0026quot;halogen_present\u0026quot;,[\u0026quot;integer\u0026quot;,\u0026quot;i64\u0026quot;]],[\u0026quot;len\u0026quot;,[\u0026quot;integer\u0026quot;,\u0026quot;u32\u0026quot;]]]' data-show-filters='true' data-show-download='true' data-show-search='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='false' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-hidden-columns='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "93088b6a2d1bb148cb09429268f135ef", "console": [], "id": "Kclp", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"3-compare-formula-and-fingerprint-classifiers\"\u003E3. Compare formula and fingerprint classifiers\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EMorgan fingerprints describe local atom environments up to radius 2 in\n\u003Cstrong\u003E2048 binary bits\u003C/strong\u003E, with chirality included. They use the existing RDKit\ngenerator; the first linked paper proposes \u003Cstrong\u003EMAP4\u003C/strong\u003E, a different fingerprint.\nMAP4 was not added or benchmarked here.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ERaw Morgan logistic uses class-balanced L2 logistic regression, C=1, without\nscaling or PCA. The forest uses 500 trees, minimum leaf size 2, square-root\nfeature sampling and class-balanced weights. These are fixed exploratory\nbaselines. Both reach \u003Cstrong\u003E88.66% balanced accuracy\u003C/strong\u003E; their AUROCs are\n\u003Cstrong\u003E0.9467\u003C/strong\u003E and \u003Cstrong\u003E0.9487\u003C/strong\u003E. Neither improves on the original formula result at\ncutoff 0.5. This does not show fingerprints are generally inferior: cohort,\nsettings, sample size and operating point all matter.\u00 ated compound's exposure must be checked separately.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe source overlap audit finds \u003Cstrong\u003EL-proline already in the natural-product\nselection\u003C/strong\u003E. It cannot be assigned opposite roles or split across folds.\n\u003Cstrong\u003E29/40 candidates share ACYCLIC\u003C/strong\u003E, so this pilot has substantial chemical\nfamily bias. More names alone will not create independent chemistry.\nDose, population, route/duration and natural-occurrence references remain\nblank for human review. No candidate was inserted into model training.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='ZHCJ-0' random-id='df8cb49d-8a18-54b2-04ff-9af617af5804'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;name\u0026#92;\u0026quot;:\u0026#92;\u0026quot;L-Alanine\u0026#92;\u0026quot;,\u0026#92;\u0026quot;pubchem_cid\u0026#92;\u0026quot;:5950,\u0026#92;\u0026quot;family\u0026#92;\u0026quot;:\u0026#92;\u0026quot;amino_acid\u0026#92;\u0026quot;,\u0026#92;\u0026quot;review_status\u0026#92;\u0026quot;:\u0026#92;\u0026quot;pending_human_review\u0026#92;\u0026quot;,\u0026#92;\u0026quot;review_caveat\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Food nutrient use has conditions; high-dose safety and plant inactivity unreviewed\u0026#92;\u0026quot;,\u0026#92;\u0026quot;food_source_url\u0026#92;\u0026quot;:\u0026#92;\u0026quot;https://www.ecfr.gov/current/title-21/section-172.320\u0026#92;\u0026quot;,\u0026#92;\u0026quot;caution_source_url\u0026#92;\u0026quot;:null,\u0026#92;\u0026quot;existing_matches\u0026#92;\u0026quot;:null},{\u0026#92;\u0026quot;name\u0026#92;\u0026quot;:\u0026#92;\u0026quot;L-Arginine\u0026#92;\u0026quot;,\u0026#92;\u0026quot;pubchem_cid\u0026#92;\u0026quot;:6322,\u0026#92;\u0026quot;family\u0026#92;\u0026quot;:\u0026#92;\u0026quot;amino_acid\u0026#92;\u0026quot;,\u0026#92;\u0026quot;review_status\u0026#92;\u0026quot;:\u0026#9 ot;str\u0026quot;]],[\u0026quot;match\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;str\u0026quot;]],[\u0026quot;existing_selection_target\u0026quot;,[\u0026quot;integer\u0026quot;,\u0026quot;i64\u0026quot;]]]' data-show-filters='true' data-show-download='true' data-show-search='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='false' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-hidden-columns='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "207be210ab5a9db6f75813f511fa1c61", "console": [], "id": "ROlb", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "812eca59bbc05425797a501d6394d1f4", "console": [], "id": "qnkX", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"6a-new-automated-preliminary-review\"\u003E6a. New: automated preliminary review\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E12 provisional dietary candidates \u00b7 26 priority review \u00b7 2 exclusions\nfrom a presumed plant-inactive group.\u003C/strong\u003E This is a review queue, not a new\nbiological label file. All high-dose and plant-activity labels remain unknown.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EProvisional list:\u003C/strong\u003E Glycerol, Glycine, L-Alanine, L-Asparagine, L-Aspartic acid, L-Glutamic acid, L-Isoleucine, L-Leucine, L-Serine, L-Threonine, L-Tyrosine, L-Valine.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe process saved 95 requests: 40 PubChem hazard sections, 40 toxicity\nsections and 15 food-use documents. Ninety-four returned HTTP 200;\nxylitol's hazard section returned 404. Food checks used \u003Cstrong\u003E2025 annual CFR\nXML\u003C/strong\u003E or FDA GRAS pages. Thirty-eight names have conditional food-use leads;\nfructose/HFCS and maltose/malt syrup remain mixture-scoped. Verify current\nconditions, exact compound form and exposure before accepting a comparator.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe rules separate GHS handling warnings from systemic codes, known\npopulation/dose cautions, prior holds, identity overlaps and family-specific\nexposure questions. They also scan selected human-toxicity/interaction\npassages. This promotes \u003Cstrong\u003Etryptophan, methionine, lysine and glutamine\u003C/strong\u003E out\nof the simpler 16-candidate pilot shortlist. Eleven candidates have text\nreview hits in the final run.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EA text hit is not a harmful-effect finding.\u003C/strong\u003E Matches can describe null\nresults, contamination, co-exposures, historical evidence or other species.\nGHS reports can vary across suppliers and conditions. Absence of a trigger\ndoes not clear the compound; the provisional group merely has fewer\nflags under this bounded policy. This is not an exhaustive literature\nreview or a validated automated safety classifier.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EMissingness stays visible:\u003C/strong\u003E five rows have gaps, even though the standalone\nevidence-gap category has zero entries (priority flags take precedence).\nThese include unavailable/missing xylitol, lactose and L-malic-acid sections\nor extracted text, plus the two mixture-scoped food references.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='qnkX-0' random-id='4500a7c2-05b7-6951-5d77-a45b1383bedc'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;category\u0026#92;\u0026quot;:\u0026#92;\ 03Ch2 id=\"6b-connecting-the-deeper-compound-review-5-november-2026\"\u003E6b. Connecting the deeper compound review \u00b7 5 November 2026\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003Enotes/compound_review_deeper_2026-10-29/\u003C/code\u003E is useful source-review work on\nthe \u003Cstrong\u003Esame 154 ChEMBL compounds, 157 observations and 14 publications\u003C/strong\u003E\nalready in the frozen assay bundle. It does not add another independent\ndataset or replace the dietary comparator review.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe audit checked all \u003Cstrong\u003E16 files\u003C/strong\u003E, verified all\n15 listed release hashes and all 154 packet structures/observation IDs,\nand confirmed that the original 16 source columns were preserved across\nall 157 log rows. Both the index and compound packets are byte-identical\nto the earlier handoff. All working activity/origin labels remain unknown.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EHistorical package:\u003C/strong\u003E the newer section 6c supersedes one of these\nconditional actives with an unresolved identity hold; these counts preserve\nwhat the older package said.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EWhat is useful:\u003C/strong\u003E 47 conditional active and 31 conditional low-response\nscenarios, 8 gray-zone rows and 68 not assessed. The low-response cases\n(10 Li 2006, 21 He 2011) are leads for an actual plant-activity dataset,\nwhereas the new dietary list addresses a different exposure question.\nFour separate ophiobolin occurrence proposals are natural-active review\nleads; they do not establish safe compounds or an ordinal middle group.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EWhat blocks training:\u003C/strong\u003E exact source structure/table matching and\npolicy/quality approval are still missing. Li and He have different doses,\nthresholds and assay contexts. Under the current scaffold policy, Li's\nproposed negatives span only two scaffolds; He's 50 proposed known\noutcomes span only two total scaffolds. Both fail three-/five-fold support.\nNo classifier was fitted during this audit.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EImportant importer limit:\u003C/strong\u003E the provisional seven-column CSVs parse\nsuccessfully. \u003Ccode\u003ENOT_FOR_TRAINING\u003C/code\u003E filenames and proposed policy names are\nnot a scientific-approval gate in the importer. Do not give those CSVs to\n\u003Ccode\u003Escreen.py --labels\u003C/code\u003E as accepted labels or pool the separate policies.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThere are \u003Cstrong\u003Efive exact original-selection overlaps\u003C/strong\u003E and \u003Cstrong\u003Eno exact or\nadditional connectivity-key overlaps with the 40 dietary candidates\u003C/strong\u003E.\nThe measured plant and dietary evidence complement each other; neither\nsupplies the other task's missing negative labels.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ENext:\u003C/strong\u003E obtain original Li/He PDF/SI, map the 82 in-study compounds to\nexact frozen structures and table columns, agree source-specific quality/\nlabel rules, then add independent negative-bearing chemical families.\nThe source package also flags ordinal/binned responses, g/kg unit issues,\ndetached-leaf mm endpoints, missing outcomes and repeated-study conflicts.\nSome copied links/access summaries are stale; use the maintained label\nguide and observation-level log. Preserve the original directory unchanged.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EFull file-by-file assessment, source checks and reproduction commands:\n\u003Ccode\u003Eanalysis/docs/deeper-assay-review.md\u003C/code\u003E. The tables below are an integrity\nand hypothetical support audit, not newly approved biological evidence.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='ecfG-0' random-id='53489147-38a9-7d8e-e5b0-8678692cc95d'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;file\u0026#92;\u0026quot;:\u0026#92;\u0026quot;PROVISIONAL_LI2006_NOT_FOR_TRAINING.csv\u0026#92;\u0026quot;,\u0026#92;\u0026quot;hypothetical_labeled_n\u0026#92;\u0026quot;:24,\u0026#92;\u0026quot;proposed_active\u0026#92;\u0026quot;:14,\u0026#92;\u0026quot;proposed_low_response\u0026#92;\u0026quot;:10,\u0026#92;\u0026quot;scaffolds\u0026#92;\u0026quot;:6,\u0026#92;\u0026quot;active_scaffolds\u0026#92;\u0026quot;:6,\u0026#92;\u0026quot;low_response_scaffolds\u0026#92;\u0026quot;:2,\u0026#92;\u0026quot;three_fold_support\u0026#92;\u0026quot;:\u0026#92;\u0026quot;insufficient_scaffold_support\u0026#92;\u0026quot;,\u0026#92;\u0026quot;five_fold_support\u0026#92;\u0026quot;:\u0026#92;\u0026quot;insufficient_scaffold_support\u0026#92;\u0026quot;,\u0026#92;\u0026quot;schema_parseable\u0026#92;\u0026quot;:true,\u0026#92;\u0026quot;scientifically_approved\u0026#92;\u0026quot;:false},{\u0026#92;\u0026quot;file\u0026#92;\u0026quot;:\u0026#92;\u0026quot;PROVISIONAL_HE2011_NOT_FOR_TRAINING.csv\u0026#92;\u0026quot;,\u0026#92;\u0026quot;hypothetical_labeled_n\u0026#92;\u0026quot;:50,\u0026#92;\u0026quot;proposed_active\u0026#92;\u0026quot;:29,\u0026#92;\u0026quot;proposed_low_response\u0026#92;\u0026quot;:21,\u0026#92;\u0026quot;scaffolds\u0026#92;\u0026quot;:2,\u0026#92;\u0026quot;active_scaffolds\u0026#92;\u0026quot;:2,\u0026#92;\u0026quot;low_response_scaffolds\u0026#92;\u0026quot;:2,\u0026#92;\u0026quot;three_fold_support\u0026#92;\u0026quot;:\u0026#92;\u0026quot;insufficient_scaffold_support\u0026#92;\u0026quot;,\u0026#92;\u0026quot;five_fold_support\u0026#92;\u0026quot;:\u0026#92;\u0026quot;insufficient_scaffold_support\u0026#92;\u0026quot;,\u0026#92;\u0026quot;schema_parseable\u0026#92;\u0026quot;:true,\u0026#92;\u0026quot;scientifically_approved\u0026#92;\u0026q plant inhibition are distinct; do not use PPO biochemistry as a direct weed label. \u0026#92;\u0026quot;,\u0026#92;\u0026quot;source_url\u0026#92;\u0026quot;:\u0026#92;\u0026quot;https://doi.org/10.1021/jf200616y\u0026#92;\u0026quot;,\u0026#92;\u0026quot;compound_specific_structure_crosswalk_verified\u0026#92;\u0026quot;:\u0026#92;\u0026quot;No\u0026#92;\u0026quot;,\u0026#92;\u0026quot;scientific_policy_approved\u0026#92;\u0026quot;:\u0026#92;\u0026quot;No\u0026#92;\u0026quot;,\u0026#92;\u0026quot;unique_compounds\u0026#92;\u0026quot;:2},{\u0026#92;\u0026quot;assay_id\u0026#92;\u0026quot;:\u0026#92;\u0026quot;CHEMBL3050086\u0026#92;\u0026quot;,\u0026#92;\u0026quot;source_doi\u0026#92;\u0026quot;:\u0026#92;\u0026quot;https://doi.org/10.1021/jf301829m\u0026#92;\u0026quot;,\u0026#92;\u0026quot;observations\u0026#92;\u0026quot;:4,\u0026#92;\u0026quot;study_level_access\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Original ACS/PubMed abstract only; compound-level source mapping not checked.\u0026#92;\u0026quot;,\u0026#92;\u0026quot;primary_source_location\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Wang et al. 2012, DOI 10.1021/jf301829m, abstract; https://pubmed.ncbi.nlm.nih.gov/22816730/\u0026#92;\u0026quot;,\u0026#92;\u0026quot;key_endpoint_caution\u0026#92;\u0026quot;:\u0026#92;\u0026quot;DEEP STUDY-FAMILY REVIEW: Original paper spans doses; verify specific ChEMBL observations actually correspond to 75 g/ha rather than the 150 g/ha highlighted in abstract. \u0026#92;\u0026quot;,\u0026#92;\u0026quot;source_url\u0026#92;\u0026quot;:\u0026#92;\u0026quot;https://doi.org/10.1021/jf301829m\u0026#92;\u0026quot;,\u0026#92;\u0026quot;compound_specific_structure_crosswalk_verified\u0026#92;\u0026quot;:\u0026#92;\u0026quot;No\u0026#92;\u0026quot;,\u0026#92;\u0026quot;scientific_policy_approved\u0026#92;\u0026quot;:\u0026#92;\u0026quot;No\u0026#92;\u0026quot;,\u0026#92;\u0026quot;unique_compounds\u0026#92;\u0026quot;:4},{\u0026#92;\u0026quot;assay_id\u0026#92;\u0026quot;:\u0026#92;\u g NOT verified\u0026#92;\u0026quot;,\u0026#92;\u0026quot;primary_source_location\u0026#92;\u0026quot;:\u0026#92;\u0026quot;He et al. (2011) DOI 10.1021/jf104247w, pp.4801\u0026#92;\u0026#92;u20134813, Inhibitory Effect (%) methods and Table 1 / footnote b\u0026#92;\u0026quot;,\u0026#92;\u0026quot;key_endpoint_caution\u0026#92;\u0026quot;:\u0026#92;\u0026quot;DEEP STUDY-FAMILY REVIEW: Original Table 1 records A=90\u0026#92;\u0026#92;u2013100%; B=75\u0026#92;\u0026#92;u201389%; C=50\u0026#92;\u0026#92;u201374%; D\u0026#92;u003c=50%, not continuous %. ChEMBL numerics are band boundaries; mapping to exact postemergence table cell remains unaudited. \u0026#92;\u0026quot;,\u0026#92;\u0026quot;source_url\u0026#92;\u0026quot;:\u0026#92;\u0026quot;https://doi.org/10.1021/jf104247w\u0026#92;\u0026quot;,\u0026#92;\u0026quot;compound_specific_structure_crosswalk_verified\u0026#92;\u0026quot;:\u0026#92;\u0026quot;No\u0026#92;\u0026quot;,\u0026#92;\u0026quot;scientific_policy_approved\u0026#92;\u0026quot;:\u0026#92;\u0026quot;No\u0026#92;\u0026quot;,\u0026#92;\u0026quot;unique_compounds\u0026#92;\u0026quot;:58},{\u0026#92;\u0026quot;assay_id\u0026#92;\u0026quot;:\u0026#92;\u0026quot;CHEMBL3050580\u0026#92;\u0026quot;,\u0026#92;\u0026quot;source_doi\u0026#92;\u0026quot;:\u0026#92;\u0026quot;https://doi.org/10.1021/jf2039444\u0026#92;\u0026quot;,\u0026#92;\u0026quot;observations\u0026#92;\u0026quot;:1,\u0026#92;\u0026quot;study_level_access\u0026#92;\u0026quot;:\u0026#92;\u0026quot;ACS primary abstract confirmed; no paper table inspected.\u0026#92;\u0026quot;,\u0026#92;\u0026quot;primary_source_location\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Yu et al. 2011 DOI 10.1021/jf2039444, abstract; https://pubmed.ncbi.nlm.nih.gov/21958315/\u0026#92;\u0026quot;,\u0026#92;\u0026quot;key_endpoint_caution\u0026#92;\u0026quot;:\u0026#92;\u0026quot;DEEP STUDY-FAMILY REVIEW: Single known comparator acifluorfen, no source table species/dose check. \u0026#92;\u0026quot;,\u0026#92;\u0026quot;source  row and seek a chemistry review.\nThis audit did not independently visually adjudicate the original figure.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe illustrated alternative below was constructed only to explain the\nproblem. Both structures have formula \u003Cstrong\u003EC18H18N4O4\u003C/strong\u003E, but\ndifferent full InChIKeys and \u003Cstrong\u003E21 different\nMorgan bits\u003C/strong\u003E (Tanimoto 0.638). This shows a\nlimitation of formula representation; it does not validate the alternative\nstructure or prove fingerprints predict activity.\u003C/span\u003E\u003C/span\u003E\u003C?xml version='1.0' encoding='iso-8859-1'?\u003E\n\u003Csvg version='1.1' baseProfile='full'\n              xmlns='http://www.w3.org/2000/svg'\n                      xmlns:rdkit='http://www.rdkit.org/xml'\n                      xmlns:xlink='http://www.w3.org/1999/xlink'\n                  xml:space='preserve'\nwidth='1000px' height='350px' viewBox='0 0 1000 350'\u003E\n\u003C!-- END OF HEADER --\u003E\n\u003Crect style='opacity:1.0;fill:#FFFFFF;stroke:none' width='1000.0' height='350.0' x='0.0' y='0.0'\u003E \u003C/rect\u003E\n\u003Cpath class='bond-0 atom-0 atom-1' d='M 395.3,287.0 L 404.4,268.8' style='fill:none;fill-rule:evenodd;stroke:#000000;stroke-width:2.0px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1' /\u003E\n\u003Cpath class='bond-0 atom-0 atom-1' d='M 404.4,268.8 L 413.4,250.6' style='fill:none;fill-rule:evenodd;stroke:#FF0000;stroke-width:2.0px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1' /\u003E\n\u003Cpath class='bond-1 atom-1 atom-2' d='M 412.0,232.4 L 400.9,215.6' style='fill:none;fill-rule:evenodd;stroke:#FF0000;stroke-width:2.0px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1' /\u003E\n\u003Cpath class='bond-1 atom-1 atom-2' d='M 400.9,215.6 L 389.8,198.8' style='fill:none;fill-rule:evenodd;stroke:#000000;stroke-width:2.0px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1' /\u003E\n\u003Cpath cl  separately.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe \u003Ca href=\"https://www.jstage.jst.go.jp/article/mycosci/62/1/62_MYC515/_html/-char/en\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E2021 primary leaf study\u003C/a\u003E\nreports lesion diameters on punctured/intact detached green-foxtail leaves.\nOphiobolin I has weak punctured-leaf response at the highest concentration\nand no intact-leaf lesions in Table 1; two other congeners have no lesions\nunder the tested conditions. Record dose, leaf treatment and duration before\nconsidering bounded low-response labels. Keep mixture synergy and anticancer\nendpoints separate from individual herbicidal activity.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EFull file-by-file assessment, sources, reproduction command and hold-aware\nlabel-check command: \u003Ccode\u003Eanalysis/docs/verification-release.md\u003C/code\u003E. These findings\nsupplement the dietary review; they establish neither benign high-dose\ncontrols nor the proposed herbicide\u2013allelopath\u2013benign ordering.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='ZBYS-3' random-id='d9428fd0-67eb-3dfe-e36e-7a4a037ecebf'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;compound_id\u0026#92;\u0026quot;:\u0026#92;\u0026quot;verification-lead:01\u0026#92;\u0026quot;,\u0026#92;\u0026quot;name\u0026#92;\u0026quot;:\u0026#92;\u0026quot;3-anhydro-ophiobolin A\u0026#92;\u0026quot;,\u0026#92;\u0026quot;status\u0026#92;\u0026quot;:\u0026#92;\u0026quot;name_not_resolved\u0026#92;\u0026quot;,\u0026#92;\u0026quot;pubchem_cid\u0026#92;\u0026quot;:null,\u0026#92;\u0026quot;resolved_inchikey\u0026#92;\u0026quot;:null,\u0026#92;\u0026quot;source_reference\u0026#92;\u0026quot;:\u0026#92;\u0026quot;https://pmc.ncbi.nlm.nih.gov/articles/PMC9157744/\u0026#92;\u0026quot;,\u0026#92;\u0026quot;reported_evidence_NOT_LABEL\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Hi 26quot;: \u0026#92;\u0026quot;interval\u0026#92;\u0026quot;\u0026#92;n      }\u0026#92;n    }\u0026#92;n  ],\u0026#92;n  \u0026#92;\u0026quot;usermeta\u0026#92;\u0026quot;: {\u0026#92;n    \u0026#92;\u0026quot;embedOptions\u0026#92;\u0026quot;: {}\u0026#92;n  },\u0026#92;n  \u0026#92;\u0026quot;width\u0026#92;\u0026quot;: 820\u0026#92;n}\u0026quot;'\u003E\u003C/marimo-mime-renderer\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "7efb700c859eb10ecc783759940ef2f6", "console": [], "id": "nHfw", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"8-what-you-must-do-before-calling-this-an-activitysafety-model\"\u003E8. What you must do before calling this an activity/safety model\u003C/h2\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003EAgree the target with your professor.\u003C/strong\u003E A source-group classifier, a\n   human dietary-safety classifier and a plant-inhibition classifier are three\n   different questions. For plant activity, predeclare species, endpoint,\n   concentration, duration, controls and active/inactive thresholds. Record\n   natural occurrence and non-target hazard separately.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EReview the dietary worksheet\u003C/strong\u003E in a new versioned copy of\n   \u003Ccode\u003Eanalysis/outputs/dietary-review-2026-11-04-final/review.csv\u003C/code\u003E. Check the exact\n   structure, occurrence in plant/animal sources, primary safety evidence,\n   dose/unit, population, route/duration and exceptions. Sign every accepted\n   decision with references. Reject caprylic/capric acids as assumed inactive;\n   resolve all holds and the proline overlap. The four-column TSV alone has\n   no safety labels. Do not overwrite the frozen template.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EReview actual plant assays.\u003C/strong\u003E Existing frozen ChEMBL material has 157\n   measurements from 14 assays/publications but no accepted activity labels.\n   Start with \u003Ccode\u003Eanalysis/docs/label_review_guide.md\u003C/code\u003E; review the original paper\n   and assay methods. Low response in one assay is not universal inactivity.\n   Keep unknown/conflicting outcomes explicit.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EThen compare the three groups.\u003C/strong\u003E Obtain diverse reviewed herbicides,\n   allelopaths and suitable comparators, reserve independent chemistry and\n   publications, deduplicate overlaps, and evaluate formula and fingerprint\n   logistic/forest models using matching holdouts. A three-class classifier\n   has no inherent ordinal \u201cmiddle\u201d; alternatively train a declared binary\n   contrast and assess an independent allelopath score distribution.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EValidate before screening.\u003C/strong\u003E Report AUROC, balanced accuracy, confusion,\n   precision\u2013recall, calibration and similarity/domain limits. Keep an\n   independent test set out of profile/threshold choices. Confirm efficacy\n   and non-target hazard separately before proposing safer bioherbicides.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EWhat you can tell your professor now:\u003C/strong\u003E \u201cThe halogen hypothesis is supported\n(37/55 versus 1/116), but non-halogen composition also separates the selection.\nI reproduced the formula result and tested raw Morgan logistic and forest\nmodels on the same scaffold folds. A 40-compound dietary candidate pilot has\nverified identifiers and explicit review flags. Actual activity prediction\nand the three-group ordering still depend on reviewed biological labels.\u201d\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "68d901557fa8dcb49f291515c8bd421f", "console": [], "id": "xXTn", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"reproduce-and-inspect-the-evidence\"\u003EReproduce and inspect the evidence\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EFrom the repository root:\u003C/span\u003E\n\u003Cdiv class=\"language-bash codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"nv\"\u003EUV_CACHE_DIR\u003C/span\u003E\u003Cspan class=\"o\"\u003E=\u003C/span\u003Eanalysis/.uv-cache\u003Cspan class=\"w\"\u003E \u003C/span\u003Euv\u003Cspan class=\"w\"\u003E \u003C/span\u003Erun\u003Cspan class=\"w\"\u003E \u003C/span\u003E--project\u003Cspan class=\"w\"\u003E \u003C/span\u003Eanalysis\u003Cspan class=\"w\"\u003E \u003C/span\u003Emarimo\u003Cspan class=\"w\"\u003E \u003C/span\u003Erun\u003Cspan class=\"w\"\u003E \u003C/span\u003Enotes/notebooks/professor_followup.py\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003EUse \u003Ccode\u003Eedit\u003C/code\u003E instead of \u003Ccode\u003Erun\u003C/code\u003E to change the notebook. A static export is at\n\u003Ccode\u003Enotes/notebooks/professor_followup.html\u003C/code\u003E; selectors need the live notebook.\nImplementation/reproduction commands and input/output contracts are in\n\u003Ccode\u003Eanalysis/docs/diagnostics-review.md\u003C/code\u003E (professor follow-up) and\n\u003Ccode\u003Eanalysis/docs/compound_sources.md\u003C/code\u003E (dietary pilot). Dated scientific results\nare in \u003Ccode\u003Eanalysis/FINDINGS.md\u003C/code\u003E. Research outputs/raw snapshots remain local\nand ignored; the requested notebook is selectively committed under notes.\nOutput hashes verify integrity, not scientific validity. Historical\nmanifests are preserved and current code may evolve separately.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EProfessor's reading list and primary source checks (4 November 2026):\u003C/strong\u003E\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC7291580/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EMAP4 paper\u003C/a\u003E: proposes a\n  different fingerprint combining circular environments with atom-pair\n  distances. It is an alternative to benchmark later, not a prerequisite\n  for the RDKit Morgan baseline.\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://pubmed.ncbi.nlm.nih.gov/36113834/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EFingerprint review / PubMed\u003C/a\u003E\n  (\u003Ca href=\"https://www.sciencedirect.com/science/article/pii/S135964462200349X\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Epublisher\u003C/a\u003E):\n  overview of fingerprint concepts/applications. Publisher access was\n  restricted; no claim of a full-text implementation from that paper.\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://greglandrum.github.io/rdkit-blog/posts/2023-01-18-fingerprint-generator-tutorial.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003ERDKit fingerprint generator tutorial\u003C/a\u003E:\n  generator configuration and bit-environment explanations.\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://www.ecfr.gov/current/title-21/section-172.320\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EAmino-acid food-use conditions\u003C/a\u003E,\n  \u003Ca href=\"https://www.ecfr.gov/current/title-21/section-172.860\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Eedible-source fatty-acid conditions\u003C/a\u003E,\n  \u003Ca href=\"https://downloads.regulations.gov/EPA-HQ-OPP-2021-0336-0002/content.pdf\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EEPA herbicide-active table\u003C/a\u003E,\n  \u003Ca href=\"https://www.fda.gov/animal-veterinary/animal-health-literacy/paws-xylitol-toxic-dogs\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EFDA xylitol warning\u003C/a\u003E.\n  Food-use provisions do not establish plant inactivity.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='xXTn-0' random-id='4094775f-789c-44d6-4d8d-6f4f25ab5876'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;bundle\u0026#92;\u0026quot;:\u0026#92;\u0026quot;professor-followup-2026-11-04-final\u0026#92;\u0026quot;,\u0026#92;\u0026quot;product\u0026#92;\u0026quot;:\u0026#92;\u0026quot;coefficients.csv\u0026#92;\u0026quot;,\u0026#92;\u0026quot;hash\u0026#92;\u0026quot;:\u0026#92;\u0026quot;verified\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;bundle\u0026#92;\u0026quot;:\u0026#92;\u0026quot;professor-followup-2026-11-04-final\u0026#92;\u0026quot;,\u0026#92;\u0026quot;product\u0026#92;\u0026quot;:\u0026#92;\u0026quot;cohort.csv\u0026#92;\u0026quot;,\u0026#92;\u0026quot;hash\u0026#92;\u0026quot;:\u0026#92;\u0026quot;verified\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;bundle\u0026#92;\u0026quot;:\u0026#92;\u0026quot;professor-followup-2026-11-04-final\u0026#92;\u0026quot;,\u0026#92;\u0026quot;product\u0026#92;\u0026quot;:\u0026#92;\u0026quot;oof.csv\u0026#92;\u0026quot;,\u0026#92;\u0026quot;hash\u0026#92;\u0026quot;:\u0026#92;\u0026quot;verified\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;bundle\u0026#92;\u0026quot;:\u0026#92;\u0026quot;professor-followup-2026-11-04-final\u0026#92;\u0026quot;,\u0026#92;\u0026quot;product\u0026#92;\u0026quot;:\u0026#92;\u0026quot;permutations.csv\u0026#92;\u0026quot;,\u0026#92;\u0026quot;hash\u0026#92;\u0026quot;:\u0026#92;\u0026quot;verified\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;bundle\u0026#92;\u0026quot;:\u0026#92;\u0026quot;professor-followup-2026-11-04-final\u0026#92;\u0026quot;,\u0026#92;\u0026quot;product\u0026#92;\u0026quot;:\u0026#92;\u0026quot;reports.csv\u0026#92;\u0026quot;,\u0026#92;\u0026quot;hash\u0026#92;\u0026quot;:\u0026#92;\u0026quot;verified\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;bundle\u0026#92;\u0026quot;:\u0026#92;\u0026quot;dietary-review-2026-11-04-final\u0026#92;\u

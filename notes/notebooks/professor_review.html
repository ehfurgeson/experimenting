      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

d": "Kclp", "name": "_"}, {"code": "", "code_hash": "c1ad884cf97a5844a9af5d958c22ec0d", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": false}, "id": "emfo", "name": "_"}, {"code": "", "code_hash": "d388558ca8929348c978055b4ca5967a", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": false}, "id": "Hstk", "name": "_"}, {"code": "", "code_hash": "ba6c3af4f2d8b1c2fa9c5d00af925146", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": false}, "id": "nWHF", "name": "_"}, {"code": "", "code_hash": "d738d5a3856ba1a260f5a20428a5fb25", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": false}, "id": "iLit", "name": "_"}, {"code": "", "code_hash": "20f693db149dc223edd39511e593ebc7", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": false}, "id": "ZHCJ", "name": "_"}, {"code": "", "code_hash": "ddbab3c6900cdb87fd57b8ec572e2e11", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": false}, "id": "ROlb", "name": "_"}], "metadata": {"marimo_version": "0.25.2"}, "version": "1"},
            "session": {"cells": [{"code_hash": "4c595cdaf6761a1b90877e0f6e48eba8", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "64a12e569c46e5757be49b59c8569fd6", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "5b6f5cd06d07723ec9ca6f7855b1b571", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "0d1bb8fdbfc0eaa658e26ce4a0f208fb", "console": [], "id": "bkHC", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"structure-is-ready-activity-ground-truth-is-the-next-gate\"\u003EStructure is ready. Activity ground truth is the next gate.\u003C/h1\u003E\n\u003Ch3 id=\"professor-review-3-november-2026\"\u003EProfessor review \u00b7 3 November 2026\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EA local, read-only review of the existing \u003Cstrong\u003E27\u201329 October\u003C/strong\u003E model runs,\nmapped to today's questions. New charts summarize saved outputs; no model\nhas been retrained, no labels inferred, and no source evidence overwritten.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EThe honest conclusion:\u003C/strong\u003E the repository has a working structure-only\nselection classifier and most requested chemical features. It has not yet\ndemonstrated a classifier for herbicidal activity in natural products.\nStrong selection accuracy does not close that scientific gap.\u003C/span\u003E\u003C/span\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 3rem'\u003E\u003Cmarimo-stat data-value='171' data-label='\u0026quot;Matched structural cohort\u0026quot;' data-bordered='false' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003Cmarimo-stat data-value='0' data-label='\u0026quot;Reviewed activity labels in working pack\u0026quot;' data-bordered='false' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003Cmarimo-stat data-value='154' data-label='\u0026quot;Working label rows\u0026quot;' data-bordered='false' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003Cmarimo-stat data-value='160' data-label='\u0026quot;Provenance checks recorded\u0026quot;' data-bordered='false' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ENavigate: \u003Ca href=\"#1-goal-assessment\"\u003EGoal assessment\u003C/a\u003E \u00b7 \u003Ca href=\"#2-formula-and-chemical-features\"\u003EFormula/features\u003C/a\u003E\n\u00b7 \u003Ca href=\"#3-fair-model-comparison\"\u003EFair model comparison\u003C/a\u003E \u00b7 \u003Ca href=\"#4-inspect-held-out-errors\"\u003EHeld-out errors\u003C/a\u003E\n\u00b7 \u003Ca href=\"#5-dimensionality-and-stress-tests\"\u003EDimensionality/stress\u003C/a\u003E \u00b7 \u003Ca href=\"#6-the-label-bottleneck\"\u003ELabels\u003C/a\u003E\n\u00b7 \u003Ca href=\"#7-expansion-sources-and-sequencing\"\u003EExpansion sources\u003C/a\u003E \u00b7 \u003Ca href=\"#8-decisions-for-today\"\u003EMeeting decisions\u003C/a\u003E\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "44ed20ed5393edb592ce47f63e56755f", "console": [], "id": "lEQa", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"1-goal-assessment\"\u003E1 \u00b7 Goal assessment\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EStatus is reported by deliverable and evidence. A completion percentage\nwould conceal that implemented software and validated biological prediction\nare different milestones.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='lEQa-1' random-id='bbcc5cb8-5092-ae56-a80d-2451b779827c'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;Professor\u0026#x27;s request\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Classifier using structure without toxicity\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Progress\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Implemented prototype\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Evidence\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Formula / RDKit descriptors / Morgan / combined models; predictors are allowlisted chemistry only\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Remaining\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Validate reviewed herbicidal activity, rather than curated selection membership\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Professor\u0026#x27;s request\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Number of different elements from formula\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Progress\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Implemented\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Evidence\u0026#92;\u0026quot;:\u0026#92;\u0026quot;element_count plus atom counts/fractions and full-composition identity audit\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Remaining\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Its standalone predictive contribution has not been isolated by these frozen runs\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Professor\u0026#x27;s request\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Is formula indicative of herbicide or natural selection?\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Progress\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Supported in this selection\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Evidence\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Formula composition performs strongly in scaffold-held-out selection evaluation\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Remaining\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Curation/elemental composition bias and overlap; not proof of origin or activity\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Professor\u0026#x27;s request\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Dimension reduction for features \u226b compounds\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Progress\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Implemented, assessed\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Evidence\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Fold-local scaling/variance filtering/PCA at 95% training variance; nested regularization and ablations\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Remaining\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Many fingerprint components remain; independent validation still needed\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Professor\u0026#x27;s request\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Rules analogous to Tice / Lipinski\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Progress\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Proxies implemented; new rule unfinished\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Evidence\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Lipinski and explicit Tice-inspired violation counts; distributions can be inspected below\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Remaining\u0026#92;\u0026quot;:\u0026#92;\u0026quot;No new independently validated agrochemical-vs-natural or activity rule set has been learned\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Professor\u0026#x27;s request\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Synthetic accessibility\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Progress\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Implemented heuristic\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Evidence\u0026#92;\u0026quot;:\u0026#92;\u0026quot;RDKit bundled Ertl SA score from molecular structure\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Remaining\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Not a synthesis route, cost estimate, activity label or validation of practical manufacturability\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Professor\u0026#x27;s request\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Longer herbicide / natural-compound lists\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Progress\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Sources assessed; bounded assay acquisition done\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Evidence\u0026#92;\u0026quot;:\u0026#92;\u0026quot;HRAC, COCONUT, LOTUS, KNApSAcK assessed; 14 ChEMBL assays / 157 measurements / 154 structures\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Remaining\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Versioned broader roster/import and reviewed actives + tested negatives; no full NP library imported\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Professor\u0026#x27;s request\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Natural actives / natural inactives classifier, then large screen\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Progress\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Scientific data gate unmet\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Evidence\u0026#92;\u0026quot;:\u0026#92;\u0026quot;0 known activity labels in the inspected working pack; scoring machinery exists\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Remaining\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Agree assay policy, curate sufficient diverse positives/negatives, reserve independent validation, then scale\u0026#92;\u0026quot;}]\u0026quot;' data-total-rows='8' data-total-columns='4' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='8' data-show-filters='false' data-show-download='true' data-show-search='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='true' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers=' lassification do not establish direct protein binding.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ESafer bioherbicide discovery:\u003C/strong\u003E features and exploratory models support the\npath toward the goal. Accepted efficacy, independent validation, non-target\nhazard profiles and practical follow-up are still needed. No safer candidate\nor deployment-ready model has been established.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E176 prepared compounds\u003C/strong\u003E in the older evidence presentation. Counts below describe eligible saved evidence, not toxicity potency. Chronic example policies deliberately leave pooled potency medians null. This cohort differs from the 171-compound structural ablations; these source flags never enter structural predictors.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='lEQa-0' random-id='6edb39e9-8209-e4aa-fe09-28c8c8a21123'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;source\u0026#92;\u0026quot;:\u0026#92;\u0026quot;PubChem\u0026#92;\u0026quot;,\u0026#92;\u0026quot;policy\u0026#92;\u0026quot;:\u0026#92;\u0026quot;mammal_oral_ld50\u0026#92;\u0026quot;,\u0026#92;\u0026quot;group\u0026#92;\u0026quot;:\u0026#92;\u0026quot;herbicide\u0026#92;\u0026quot;,\u0026#92;\u0026quot;selected_n\u0026#92;\u0026quot;:60,\u0026#92;\u0026quot;assessed_n\u0026#92;\u0026quot;:60,\u0026#92;\u0026quot;eligible_n\u0026#92;\u0026quot;:39},{\u0026#92;\u0026quot;source\u0026#92;\u0026quot;:\u0026#92;\u0026quot;PubChem\u0026#92;\u0026quot;,\u0026#92;\u0026quot;policy\u0026#92;\u0026quot;:\u0026#92;\u0026quot;mammal_oral_ld50\u0026#92;\u0026quot;,\u0026# 3E\n\u003Cth\u003ECurrent repository gap\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ca href=\"https://hracglobal.com/tools/2026-hrac-global-herbicide-moa-classification\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EHRAC 2026 master list\u003C/a\u003E\u003C/td\u003E\n\u003Ctd\u003EExtend recognized herbicide identities/MoA; XLSX with/without structures\u003C/td\u003E\n\u003Ctd\u003EFreeze roster and review salts/esters/stereo; not a standardized active/inactive assay dataset\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ca href=\"https://coconut.naturalproducts.net/download\" rel=\"noopener noreferrer\" target=\"_blank\"\u003ECOCONUT downloads\u003C/a\u003E\u003C/td\u003E\n\u003Ctd\u003EVersioned natural-product structure library; page now offers \u003Cstrong\u003ENovember 2026\u003C/strong\u003E CSV/SDF and CC0 release\u003C/td\u003E\n\u003Ctd\u003ENo full import/batch scorer yet; database 'active/inactive' terminology is not herbicidal ground truth\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ca href=\"https://elifesciences.org/articles/70780\" rel=\"noopener noreferrer\" target=\"_blank\"\u003ELOTUS primary description\u003C/a\u003E, \u003Ca href=\"https://lotus.naturalproducts.net/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Eportal\u003C/a\u003E\u003C/td\u003E\n\u003Ctd\u003EReferenced structure\u2013organism relationships for occurrence and literature leads\u003C/td\u003E\n\u003Ctd\u003EFreeze export/query and review provenance; occurrence does not imply activity; portal content was not text-readable in this check\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ca href=\"https://www.knapsackfamily.com/knapsack_core/top.php\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EKNApSAcK Core\u003C/a\u003E\u003C/td\u003E\n\u003Ctd\u003ETargeted metabolite/species/structure searches and references\u003C/td\u003E\n\u003Ctd\u003EBroader acquisition remains unimplemented; source page restricts redistribution/commercial use without contact; establish an appropriate access/reuse route\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EFrozen ChEMBL plant assays / PubChem BioAssay literature leads\u003C/td\u003E\n\u003Ctd\u003EReviewed comparable actives and tested negatives before broad screening\u003C/td\u003E\n\u003Ctd\u003E14 assays acquired; original-paper context and label adjudication still needed\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ESequence:\u003C/strong\u003E agree activity policy \u2192 curate diverse actives/tested negatives\nand natural-occurrence evidence \u2192 reserve independent chemical/publication\nholdouts \u2192 evaluate structure models and calibration \u2192 freeze a natural-product\nrelease \u2192 implement bounded batch scoring with identity/provenance/domain checks.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EHRAC and natural-source enrichment can be prepared now. Claims that a model\n'performs well' should use an agreed, independent activity validation criterion,\nnot the selection scores above. The existing candidate command loads the\nlist in memory and uses pairwise similarity; a full-library batch interface\nis a separate engineering step. See \u003Ccode\u003Eanalysis/docs/compound_sources.md\u003C/code\u003E\nfor the original dated source assessment and specific assay leads.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "20f693db149dc223edd39511e593ebc7", "console": [], "id": "ZHCJ", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"8-decisions-for-today\"\u003E8 \u00b7 Decisions for today\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ESuggested meeting summary:\u003C/strong\u003E \u201cWe have the structure-only feature/model pipeline,\nincluding formula composition, PCA, rule proxies and SA. Formula discriminates\nour curated groups well, but that is not yet an activity classifier. We have\nadditional measured plant-assay evidence ready for review; the immediate next\nmilestone is a defensible activity/origin training set and independent validation.\u201d\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003EDefine the task:\u003C/strong\u003E prioritize predicting plant activity in natural candidates;\n   maintain natural occurrence as a separate cited label. Is a broad selection\n   diagnostic also useful as a secondary research question?\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EAgree biological policy:\u003C/strong\u003E species/weed, pre/post emergence, endpoint,\n   exposure/duration, controls, positive/negative bands, qualifiers and conflicts.\n   What would constitute a useful tested negative?\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EChoose validation before more model search:\u003C/strong\u003E reserve publications/chemotypes,\n   agree precision\u2013recall and sensitivity tradeoffs, calibration/domain checks,\n   and what evidence would justify broad candidate screening. Scaffold support\n   matters more than simply reaching a large row count.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EDecide the next deliverable:\u003C/strong\u003E a versioned reviewed-label pilot and its\n   audit, then a held-out activity benchmark. For a rule set, predeclare a small\n   interpretable candidate family and validate it without whole-dataset threshold picking.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EKeep the broader goals visible:\u003C/strong\u003E separate non-target hazard comparison,\n   known binding-interaction curation and practical accessibility from efficacy.\n   None is completed merely by making the candidate library larger.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EReadiness:\u003C/strong\u003E feature extraction \u003Cstrong\u003Eready\u003C/strong\u003E; internal selection modeling\n\u003Cstrong\u003Edemonstrated, exploratory\u003C/strong\u003E; new discriminating rule set \u003Cstrong\u003Enot validated\u003C/strong\u003E;\nbiological activity training data \u003Cstrong\u003Erequires review\u003C/strong\u003E; broad natural-product\nscreen \u003Cstrong\u003Ewaits on validation and batch engineering\u003C/strong\u003E. This gives concrete\nfinish criteria without inventing a completion percentage or a safety claim.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "ddbab3c6900cdb87fd57b8ec572e2e11", "console": [], "id": "ROlb", "outputs": [{"data": {"text/html": "\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eProvenance and what was verified for this notebook\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false' data-expanded='[]'\u003E\u003Cdiv\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe loader checks frozen output hashes before reading CSVs, verifies\nfixed/nested cohort identity and exact outer-fold assignments across profiles,\nrejects scaffold leakage, and recomputes saved metrics from OOF probabilities.\nInput/code/lock matches or drift are displayed below, separately from product\nintegrity. Working labels are a live local copy and may legitimately differ\nfrom their original template. No acquisition, fitting or scientific output\nwrites occur during notebook execution. New UI state/cache/export files stay local.\u003C/span\u003E\u003C/span\u003E\u
